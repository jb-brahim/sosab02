<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📳 Testeur de Vibration Jackhammer (Puissance Max)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }
        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 24px;
            padding: 24px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }
        h1 { font-size: 20px; margin-bottom: 10px; color: #f59e0b; }
        p { font-size: 13px; color: #94a3b8; margin-bottom: 20px; line-height: 1.5; }
        .btn {
            width: 100%;
            padding: 16px;
            margin-bottom: 12px;
            border: none;
            border-radius: 16px;
            font-weight: 800;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-jackhammer { background: linear-gradient(135deg, #ef4444, #dc2626); color: white; text-shadow: 0 1px 2px rgba(0,0,0,0.5); }
        .btn-rapid { background: linear-gradient(135deg, #f59e0b, #d97706); color: #0f172a; }
        .btn-long { background: linear-gradient(135deg, #3b82f6, #2563eb); color: white; }
        .btn-stop { background: #334155; color: #94a3b8; }
        .btn:active { transform: scale(0.96); }
        .status {
            margin-top: 15px;
            padding: 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
            background: #0f172a;
            border: 1px solid #334155;
            color: #10b981;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🔨 Testeur Jackhammer (Vibration FORTE)</h1>
        <p>Utilise la modulation d'impulsions haute fréquence (PWM) pour faire résonner le châssis de votre téléphone à puissance maximale.</p>

        <button class="btn btn-jackhammer" onclick="testJackhammer()">
            🔨 EFFET MARTEAU-PIQUEUR (Puissance Max)
        </button>

        <button class="btn btn-rapid" onclick="testRapidStaccato()">
            ⚡ VIBRATION STACCATO RAPIDE (Haute Résonance)
        </button>

        <button class="btn btn-long" onclick="testLongPulse()">
            📳 IMPULSION MAX 5 SECONDES
        </button>

        <button class="btn btn-stop" onclick="stopVibrate()">
            🛑 Arrêter la Vibration
        </button>

        <div id="status" class="status">Appuyez sur un bouton pour tester la puissance</div>
    </div>

    <script>
        function testJackhammer() {
            stopVibrate();
            const status = document.getElementById('status');
            if ("vibrate" in navigator) {
                // Generate 50 rapid 90ms/15ms PWM pulses (Excites ERM motor resonance)
                const pattern = [];
                for (let i = 0; i < 40; i++) {
                    pattern.push(90, 15);
                }
                pattern.push(300);
                for (let i = 0; i < 40; i++) {
                    pattern.push(90, 15);
                }

                try {
                    navigator.vibrate(0);
                    const res = navigator.vibrate(pattern);
                    status.innerText = res ? "🔨 Vibration Jackhammer lancée à puissance max !" : "⚠️ Refusé par le système";
                    status.style.color = res ? "#10b981" : "#f59e0b";
                } catch(e) {
                    status.innerText = "❌ Erreur: " + e.message;
                    status.style.color = "#ef4444";
                }
            }
        }

        function testRapidStaccato() {
            stopVibrate();
            const status = document.getElementById('status');
            if ("vibrate" in navigator) {
                const pattern = [];
                for (let i = 0; i < 60; i++) {
                    pattern.push(120, 20);
                }
                try {
                    navigator.vibrate(0);
                    navigator.vibrate(pattern);
                    status.innerText = "⚡ Staccato rapide actif !";
                    status.style.color = "#f59e0b";
                } catch(e) {}
            }
        }

        function testLongPulse() {
            stopVibrate();
            if ("vibrate" in navigator) {
                navigator.vibrate(0);
                navigator.vibrate([5000]);
                document.getElementById('status').innerText = "📳 Impulsion 5 secondes active";
                document.getElementById('status').style.color = "#3b82f6";
            }
        }

        function stopVibrate() {
            if ("vibrate" in navigator) {
                navigator.vibrate(0);
            }
            document.getElementById('status').innerText = "🛑 Vibration arrêtée";
            document.getElementById('status').style.color = "#94a3b8";
        }
    </script>
</body>
</html>
